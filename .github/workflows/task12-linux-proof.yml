name: Task 12 Linux proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-proof:
    name: Anonymous TTS staging and publication
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the reviewed source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 63a23233763b48a964ba22c11adf5a3dc703ea2c

      - name: Verify host and reviewed revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(git rev-parse HEAD)" = 63a23233763b48a964ba22c11adf5a3dc703ea2c

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install locked test dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Run the approved Linux architecture gate
        shell: bash
        env:
          HERMES_TEST_FILE_RETRIES: "0"
          HERMES_TEST_WORKERS: "4"
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          set -euo pipefail
          scripts/run_tests.sh \
            tests/hermes_cli/test_persistence_observation.py \
            tests/tools/test_tts_anonymous_staging.py \
            tests/tools/test_tts_sink_adapters.py \
            tests/tools/test_tts_provider_lifecycle.py \
            tests/tools/test_tts_transaction_decision.py \
            tests/tools/test_tts_publish.py \
            tests/tools/test_tts_publish_darwin.py \
            tests/tools/test_tts_publish_linux.py \
            tests/tools/test_tts_anonymous_integration.py \
            -q
